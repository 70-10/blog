pre-commit:
  parallel: true
  commands:
    eslint:
      glob: "*.{ts,js,cjs,mjs,json,yml,astro}"
      run: pnpm eslint --fix {staged_files}
      stage_fixed: true
    prettier-code:
      glob: "*.{ts,js,cjs,mjs,json,yml,astro}"
      run: pnpm prettier --write {staged_files}
      stage_fixed: true
    prettier-md:
      glob: "*.md"
      run: pnpm prettier --write {staged_files}
      stage_fixed: true
    textlint:
      # 対象は記事だけ。package.json の lint:textlint（CI が使う）と揃える。
      # .textlintrc は読む人向けの記事のための設定なので、docs や skill には当てない
      glob: "src/content/posts/*.md"
      run: pnpm textlint --fix {staged_files}
      stage_fixed: true

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
